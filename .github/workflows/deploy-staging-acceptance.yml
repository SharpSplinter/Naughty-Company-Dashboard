name: Deploy Naughty Family acceptance staging

on:
  # Staging deployment is intentionally operator-triggered. Do not redeploy
  # Worker, D1 migrations, Pages, or Playwright for every branch commit.
  workflow_dispatch:
    inputs:
      confirm_target:
        description: Confirm the isolated staging Pages project and API Worker
        required: true
        type: choice
        options:
          - naughtyfamily-staging

permissions:
  contents: read

concurrency:
  group: naughty-family-real-key-acceptance-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/portal-rebuild' && (github.event_name == 'push' || inputs.confirm_target == 'naughtyfamily-staging')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the reviewed PR branch
        uses: actions/checkout@v7
        with:
          ref: portal-rebuild

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository quality gates
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Verify every deployment target is isolated staging
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'name = "naughtyfamily-api-staging"' wrangler.acceptance.toml
          grep -F 'database_name = "naughtyfamily-acceptance-staging"' wrangler.acceptance.toml
          grep -F 'database_id = "02cca699-1232-495f-8a0a-de525058b92a"' wrangler.acceptance.toml
          grep -F 'ALLOWED_ORIGIN = "https://naughtyfamily-staging.pages.dev"' wrangler.acceptance.toml
          ! grep -F 'bbbe128a-c5cc-46ec-b8ef-93860183e795' wrangler.acceptance.toml
          grep -F 'binding = "GLOBAL_RANKINGS_QUEUE"' wrangler.acceptance.toml
          grep -F 'queue = "ncd-naughtyfamily-staging-collection"' wrangler.acceptance.toml
          grep -F 'dead_letter_queue = "ncd-naughtyfamily-staging-dlq"' wrangler.acceptance.toml
          ! grep -F 'ncd-global-rankings-refresh' wrangler.acceptance.toml
          ! grep -F 'ncd-faction-performance-integration' wrangler.acceptance.toml
          grep -F 'database_id = "1e37f1a5-daa3-41fb-8c1b-7a9c6e3d0405"' wrangler.staging.toml
          ! grep -F '[triggers]' wrangler.acceptance.toml
          echo "Confirmed: acceptance Worker uses isolated staging D1 and staging-only Queues; cron triggers are omitted to respect the account Free-plan quota, and production targets are excluded."

      - name: Provision isolated staging Queues
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c03b978ed9a59adc3f61c715bdad45c
        run: node scripts/ensure-naughtyfamily-staging-queues.mjs

      - name: Apply pending migrations to staging D1 only
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: d1 migrations apply naughtyfamily-acceptance-staging --remote --config wrangler.acceptance.toml

      - name: Verify staging migration ledger
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: d1 migrations list naughtyfamily-acceptance-staging --remote --config wrangler.acceptance.toml

      - name: Deploy isolated staging API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: deploy --config wrangler.acceptance.toml

      - name: Verify staging API health, encryption readiness, and browser CORS
        env:
          STAGING_API_URL: https://naughtyfamily-api-staging.kboone801.workers.dev
          STAGING_PAGES_ORIGIN: https://naughtyfamily-staging.pages.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.STAGING_API_URL;
          const origin = process.env.STAGING_PAGES_ORIGIN;
          let health = null;
          for (let attempt = 1; attempt <= 8; attempt++) {
            const response = await fetch(`${base}/health`, {
              headers: { accept: "application/json", origin },
              signal: AbortSignal.timeout(10000),
            }).catch(() => null);
            if (response?.ok) {
              health = { response, body: await response.json().catch(() => null) };
              break;
            }
            if (attempt < 8) await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!health) throw new Error("Staging Worker health endpoint did not become ready.");
          const allowOrigin = health.response.headers.get("access-control-allow-origin");
          console.log(`STAGING /health -> ${health.response.status}; database=${health.body?.database}; keyEncryption=${health.body?.keyEncryption}; cors=${allowOrigin === origin}`);
          if (health.body?.ok !== true || health.body?.database !== "ok" || health.body?.keyEncryption !== "ok" || allowOrigin !== origin) {
            throw new Error("Staging is not safe for member credentials. Verify staging D1, CORS and a unique KEY_ENCRYPTION_SECRET on naughtyfamily-api-staging.");
          }
          const preflight = await fetch(`${base}/api/auth/session`, {
            method: "OPTIONS",
            headers: { origin, "access-control-request-method": "GET", "access-control-request-headers": "authorization" },
          });
          const preflightOrigin = preflight.headers.get("access-control-allow-origin");
          console.log(`STAGING CORS preflight -> ${preflight.status}; originAllowed=${preflightOrigin === origin}`);
          if (preflight.status !== 204 || preflightOrigin !== origin) throw new Error("Staging browser CORS preflight failed.");
          NODE

      - name: Build Pages bundle for staging API
        env:
          VITE_API_BASE_URL: https://naughtyfamily-api-staging.kboone801.workers.dev
        run: npm run build

      - name: Deploy to the isolated naughtyfamily-staging Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: pages deploy dist --project-name naughtyfamily-staging --branch main

      - name: Verify the staging Pages origin
        env:
          STAGING_PAGES_URL: https://naughtyfamily-staging.pages.dev
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.STAGING_PAGES_URL;
          const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
          const html = await response.text();
          const assetPaths = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map(match => match[1]).filter(assetPath => assetPath.includes(".js"));
          if (!response.ok || !html.includes('id="root"') || assetPaths.length === 0) {
            throw new Error("Staging Pages did not serve the portal shell and JavaScript assets.");
          }
          const assets = await Promise.all(assetPaths.map(async assetPath => {
            const assetUrl = new URL(assetPath, url).toString();
            const assetResponse = await fetch(assetUrl, { signal: AbortSignal.timeout(15000) });
            if (!assetResponse.ok) throw new Error(`Staging asset failed: ${assetResponse.status} ${assetPath}`);
            return await assetResponse.text();
          }));
          const correctApiBase = assets.some(asset => asset.includes("naughtyfamily-api-staging.kboone801.workers.dev"));
          console.log(`STAGING PAGES -> ${response.status}; rootMount=true; jsAssets=${assetPaths.length}; correctApiBaseInBundle=${correctApiBase}`);
          if (!correctApiBase) {
            throw new Error("Staging JavaScript assets do not embed the isolated acceptance API Worker URL.");
          }
          NODE

      - name: Install Playwright Chromium for staging viewport checks
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Run Company Dashboard responsive checks on staging
        env:
          STAGING_PAGES_URL: https://naughtyfamily-staging.pages.dev
        run: node scripts/test-staging-responsive.mjs

      - name: Upload staging viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-dashboard-staging-viewports
          path: test-results/staging-responsive/
          if-no-files-found: ignore
