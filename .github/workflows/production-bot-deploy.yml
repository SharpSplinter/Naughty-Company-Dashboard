name: Deploy Production Discord Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bot/production-worker.js"
      - "bot/alert-delivery.mjs"
      - "bot/test-alert-delivery.mjs"
      - "bot/financials.mjs"
      - "bot/test-financials.mjs"
      - "bot/daily-summary.mjs"
      - "bot/test-daily-summary.mjs"
      - "bot/formatting.mjs"
      - "bot/test-formatting.mjs"
      - "bot/wrangler.production.toml"
      - "bot/register-commands.mjs"
      - "bot/test-register-commands.mjs"
      - "bot/command-schema.mjs"
      - "bot/command-schema-contract.mjs"
      - "bot/command-options.mjs"
      - "bot/command-routing.mjs"
      - "bot/test-command-dispatch.mjs"
      - "bot/commands/**"
      - "bot/test-command-contract.mjs"
      - "bot/test-interaction-lifecycle.mjs"
      - "bot/test-interaction-edge-cases.mjs"
      - "bot/production-health.mjs"
      - "bot/check-production-health.mjs"
      - "bot/test-production-health.mjs"
      - "bot/configure-production-endpoint.mjs"
      - "bot/migrations/0001_bot_schema.sql"
      - ".github/workflows/production-bot-deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "bot/production-worker.js"
      - "bot/alert-delivery.mjs"
      - "bot/test-alert-delivery.mjs"
      - "bot/financials.mjs"
      - "bot/test-financials.mjs"
      - "bot/daily-summary.mjs"
      - "bot/test-daily-summary.mjs"
      - "bot/formatting.mjs"
      - "bot/test-formatting.mjs"
      - "bot/wrangler.production.toml"
      - "bot/register-commands.mjs"
      - "bot/test-register-commands.mjs"
      - "bot/command-schema.mjs"
      - "bot/command-schema-contract.mjs"
      - "bot/command-options.mjs"
      - "bot/command-routing.mjs"
      - "bot/test-command-dispatch.mjs"
      - "bot/commands/**"
      - "bot/test-command-contract.mjs"
      - "bot/test-interaction-lifecycle.mjs"
      - "bot/test-interaction-edge-cases.mjs"
      - "bot/production-health.mjs"
      - "bot/check-production-health.mjs"
      - "bot/test-production-health.mjs"
      - "bot/configure-production-endpoint.mjs"
      - "bot/migrations/0001_bot_schema.sql"
      - ".github/workflows/production-bot-deploy.yml"

permissions:
  contents: read

concurrency:
  group: naughty-company-bot-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate production Worker syntax
        run: node --check bot/production-worker.js
      - name: Validate financial helper syntax
        run: node --check bot/financials.mjs
      - name: Validate daily summary helper syntax
        run: node --check bot/daily-summary.mjs
      - name: Validate bot formatting helpers
        run: node --check bot/formatting.mjs
      - name: Validate alert delivery helpers and tests
        run: |
          node --check bot/alert-delivery.mjs
          node --check bot/test-alert-delivery.mjs
          node --check bot/commands/automation.mjs
      - name: Validate command registration script
        run: node --check bot/register-commands.mjs
      - name: Validate command registration API tests
        run: node --check bot/test-register-commands.mjs
      - name: Validate canonical command schema
        run: node --check bot/command-schema.mjs
      - name: Validate canonical-to-live command schema comparator
        run: node --check bot/command-schema-contract.mjs
      - name: Validate command option builder syntax
        run: node --check bot/command-options.mjs
      - name: Validate nested interaction router syntax
        run: node --check bot/command-routing.mjs
      - name: Validate command dispatch integration tests
        run: node --check bot/test-command-dispatch.mjs
      - name: Validate individual command definitions
        run: for file in bot/commands/*.mjs; do node --check "$file"; done
      - name: Test Discord command contract and production safeguards
        run: node bot/test-command-contract.mjs
      - name: Test canonical command dispatch, invalid routes, and autocomplete
        run: node bot/test-command-dispatch.mjs
      - name: Test Discord command registration API behavior
        run: node bot/test-register-commands.mjs
      - name: Test private alert delivery and retry behavior
        run: node bot/test-alert-delivery.mjs
      - name: Test daily company summary formatting and comparisons
        run: node bot/test-daily-summary.mjs
      - name: Test interaction acknowledgements, slow paths, and failure responses
        run: node bot/test-interaction-lifecycle.mjs
      - name: Test account linking, authorization failures, malformed requests, and multi-part replies
        run: node bot/test-interaction-edge-cases.mjs
      - name: Test company financial estimates
        run: node bot/test-financials.mjs
      - name: Test bot money and count formatting
        run: node bot/test-formatting.mjs
      - name: Validate production endpoint sync script
        run: node --check bot/configure-production-endpoint.mjs
      - name: Validate production health-check scripts
        run: |
          node --check bot/production-health.mjs
          node --check bot/check-production-health.mjs
      - name: Test production health-check contract
        run: node bot/test-production-health.mjs
      - name: Validate production-only target
        run: |
          grep -Fq 'name = "naughty-company-bot"' bot/wrangler.production.toml
          ! grep -qi 'staging' bot/wrangler.production.toml
          grep -Fq 'naughty-company-bot-production' bot/wrangler.production.toml
          grep -Fq 'DISCORD_PUBLIC_KEY = "' bot/wrangler.production.toml
          test -f bot/migrations/0001_bot_schema.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS discord_links' bot/migrations/0001_bot_schema.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS alert_preferences' bot/migrations/0001_bot_schema.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS discord_alert_poll_state' bot/migrations/0001_bot_schema.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS discord_alert_poll_escalations' bot/migrations/0001_bot_schema.sql
          grep -Fq 'naughty-company-bot.kboone801.workers.dev' bot/configure-production-endpoint.mjs
          grep -Fq '/health' bot/check-production-health.mjs
          grep -Fq 'sub("global"' bot/commands/company.mjs
          grep -Fq 'sub("faction"' bot/commands/company.mjs
          grep -Fq 'str("detail"' bot/command-options.mjs
          grep -Fq 'value: "full"' bot/command-options.mjs
          grep -Fq 'sub("status"' bot/commands/automation.mjs
          grep -Fq 'group("webhook"' bot/commands/automation.mjs
          ! grep -Fq 'group("rules"' bot/commands/automation.mjs
          ! grep -Fq 'sub("configure"' bot/commands/automation.mjs
  deploy-production:
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require production deployment and Discord registration credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$DISCORD_TOKEN" || { echo "::error::Missing DISCORD_TOKEN repository Actions secret. Cloudflare Worker secrets are not shared with Actions."; exit 1; }
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Discord token before production deployment
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node bot/register-commands.mjs --check-token
      - name: Initialize production bot database schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@3.90.0 d1 execute naughty-company-bot-production --remote --file bot/migrations/0001_bot_schema.sql --config bot/wrangler.production.toml
      - name: Deploy only the production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: deploy --config bot/wrangler.production.toml
      - name: Set Discord interactions endpoint to production
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node bot/configure-production-endpoint.mjs
      - name: Register the updated guild slash commands
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node bot/register-commands.mjs
      - name: Verify production Worker health endpoint
        env:
          DISCORD_INTERACTIONS_ENDPOINT: https://naughty-company-bot.kboone801.workers.dev
        run: node bot/check-production-health.mjs
