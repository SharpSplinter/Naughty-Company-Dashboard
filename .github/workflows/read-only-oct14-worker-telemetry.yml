name: Read-only Worker telemetry probe for Oct 14 snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query Cloudflare Worker telemetry for 18:00-18:10 UTC
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c03b978ed9a59adc3f61c715bdad45c
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing or empty."
            exit 1
          fi
          FROM_MS=1792000800000
          TO_MS=1792001400000

          query_worker() {
            local worker="$1"
            local output_file
            output_file="$(mktemp)"
            local http_status
            http_status="$(curl --silent --show-error --output "$output_file" --write-out '%{http_code}' \
              --request POST \
              --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/observability/telemetry/query" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$(jq -cn --arg worker "$worker" --argjson from "$FROM_MS" --argjson to "$TO_MS" '{
                queryId: ("readonly-oct14-snapshot-" + $worker),
                view: "events",
                limit: 200,
                timeframe: {from: $from, to: $to},
                parameters: {
                  datasets: ["cloudflare-workers"],
                  filters: [
                    {id: "worker-service", key: "$metadata.service", operation: "eq", type: "string", value: $worker}
                  ],
                  calculations: [],
                  groupBys: [],
                  havings: []
                }
              }')")"

            echo "=== Worker: $worker | HTTP $http_status ==="
            if [[ "$http_status" != "200" ]] || ! jq -e '.success == true' "$output_file" >/dev/null; then
              jq -r 'if (.errors | type) == "array" then .errors[] | .message // "Cloudflare API query failed" else "Cloudflare API query failed; response body suppressed." end' "$output_file" 2>/dev/null || true
              rm -f "$output_file"
              return 1
            fi

            jq -r '
              (.result.events.events // .result.events // []) as $events |
              "Returned events: \($events|length)",
              (if ($events|length) == 0 then "No matching events in this window."
               else ($events[] |
                 "timestamp=\(.timestamp // .datetime // .time // "unavailable" | tostring)",
                 "fields=\(keys | join(","))",
                 "metadata=\((.["$metadata"] // .metadata // {}) | {service, scriptName, origin, requestId, trigger, outcome})",
                 "logs_shape=\((.logs // null) | if type == "array" then map(if type == "object" then keys else type end) elif type == "object" then keys else type end)",
                 "event_shape=\((.event // null) | if type == "array" then map(if type == "object" then keys else type end) elif type == "object" then keys else type end)",
                 "message_fields=\((to_entries | map(select(.key|test("message|level|event";"i")) | .key)) | join(","))"
               ) end)
            ' "$output_file"
            rm -f "$output_file"
          }

          failed=0
          query_worker "naughty-company-api-staging" || failed=1
          query_worker "naughty-company-api" || failed=1
          exit "$failed"
