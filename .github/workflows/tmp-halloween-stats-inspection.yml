name: Temporary Halloween stats payload inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Halloween log shapes without exposing raw entries
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY_FULL_ACCESS }}
        run: |
          node <<'NODE'
          const start = 1792929600;
          const end = 1793534400;
          if (!process.env.TORN_API_KEY) throw new Error("Required repository secret is unavailable.");
          let url = new URL("https://api.torn.com/v2/user/log");
          url.searchParams.set("from", String(start));
          url.searchParams.set("to", String(end));
          url.searchParams.set("log", "2535,2536,2540");
          url.searchParams.set("limit", "100");
          const records = [];
          const attackRecords = [];
          const fetchPages = async (path, queryName, out) => {
            let requestUrl = new URL("https://api.torn.com/v2/" + path);
            requestUrl.searchParams.set("from", String(start));
            requestUrl.searchParams.set("to", String(end));
            requestUrl.searchParams.set(queryName, queryName === "log" ? "2535,2536,2540" : "outgoing");
            requestUrl.searchParams.set("limit", "100");
            if (queryName === "sort") requestUrl.searchParams.set("sort", "DESC");
            if (queryName !== "log") requestUrl.searchParams.set("sort", "DESC");
            for (let page = 0; page < 100; page++) {
              const response = await fetch(requestUrl, {
                headers: { Authorization: "ApiKey " + process.env.TORN_API_KEY, Accept: "application/json" }
              });
              const payload = await response.json();
              if (!response.ok || payload?.error) throw new Error("Torn " + path + " request failed (HTTP " + response.status + ").");
              const pageRows = queryName === "log" ? payload?.log : payload?.attacks;
              if (!Array.isArray(pageRows)) throw new Error("Unexpected Torn " + path + " response shape.");
              out.push(...pageRows);
              const links = payload?._metadata?.links ?? {};
              const older = links.prev ?? links.next;
              if (!older) return page + 1;
              const parsed = new URL(older, requestUrl);
              if (parsed.protocol !== "https:" || parsed.hostname !== "api.torn.com" || parsed.pathname !== "/v2/" + path || parsed.searchParams.has("key")) throw new Error("Unsafe pagination URL.");
              requestUrl = parsed;
              if (page === 99) throw new Error("Pagination safety limit reached for " + path + ".");
            }
            return 100;
          };
          const logPages = await fetchPages("user/log", "log", records);
          const attackPages = await fetchPages("user/attacks", "filters", attackRecords);
          const byType = {};
          const itemTotals = {};
          const treatDistribution = {};
          const treatTypeDistribution = {};
          const exchangeItemShape = {};
          const fieldShapes = {};
          for (const row of records) {
            const id = String(row?.details?.id ?? "unknown");
            byType[id] = (byType[id] ?? 0) + 1;
            const data = row?.data && typeof row.data === "object" && !Array.isArray(row.data) ? row.data : {};
            const params = row?.params && typeof row.params === "object" && !Array.isArray(row.params) ? row.params : {};
            if (["2535", "2536", "2540"].includes(id) && !fieldShapes[id]) {
              fieldShapes[id] = {
                title: row?.details?.title ?? null,
                category: row?.details?.category ?? null,
                data: Object.fromEntries(Object.entries(data).map(([k,v]) => [k, Array.isArray(v) ? "array" : v === null ? "null" : typeof v])),
                params: Object.fromEntries(Object.entries(params).map(([k,v]) => [k, Array.isArray(v) ? "array" : v === null ? "null" : typeof v]))
              };
            }
            if (id === "2536") {
              const n = Number(data.treats);
              if (Number.isFinite(n) && n >= 0) treatDistribution[String(n)] = (treatDistribution[String(n)] ?? 0) + 1;
              const type = String(data.type ?? "missing");
              treatTypeDistribution[type] = (treatTypeDistribution[type] ?? 0) + 1;
            }
            if (id === "2535") {
              const items = data.items && typeof data.items === "object" ? data.items : {};
              const keys = Object.keys(items).sort();
              const shape = keys.length ? keys.map(k => k + ":" + (Array.isArray(items[k]) ? "array" : items[k] === null ? "null" : typeof items[k])).join(",") : "empty";
              exchangeItemShape[shape] = (exchangeItemShape[shape] ?? 0) + 1;
              for (const [itemId, quantity] of Object.entries(items)) {
                const n = Number(quantity);
                if (/^\\d+$/.test(itemId) && Number.isFinite(n) && n >= 0) itemTotals[itemId] = (itemTotals[itemId] ?? 0) + n;
              }
            }
          }
          const attackResults = {};
          const modifierNames = {};
          const finishingHitEffectNames = {};
          let attackShape = null;
          for (const row of attackRecords) {
            const result = String(row?.result ?? "missing");
            attackResults[result] = (attackResults[result] ?? 0) + 1;
            for (const effect of Array.isArray(row?.finishing_hit_effects) ? row.finishing_hit_effects : []) {
              const name = String(effect?.name ?? "missing");
              finishingHitEffectNames[name] = (finishingHitEffectNames[name] ?? 0) + 1;
            }
            const modifiers = row?.modifiers;
            if (Array.isArray(modifiers)) {
              for (const modifier of modifiers) {
                const name = String(modifier?.name ?? modifier?.type ?? modifier?.id ?? "unlabelled");
                modifierNames[name] = (modifierNames[name] ?? 0) + 1;
              }
            } else if (modifiers && typeof modifiers === "object") {
              for (const [name, value] of Object.entries(modifiers)) {
                modifierNames[name] = (modifierNames[name] ?? 0) + (typeof value === "number" ? value : 1);
              }
            }
            if (!attackShape) attackShape = {
              keys: Object.keys(row ?? {}).sort(),
              attackerKeys: Object.keys(row?.attacker ?? {}).sort(),
              modifierKind: Array.isArray(modifiers) ? "array" : modifiers === null ? "null" : typeof modifiers,
              modifierItemKeys: Array.isArray(modifiers) && modifiers[0] && typeof modifiers[0] === "object" ? Object.keys(modifiers[0]).sort() : [],
              finishingEffectItemKeys: Array.isArray(row?.finishing_hit_effects) && row.finishing_hit_effects[0] ? Object.keys(row.finishing_hit_effects[0]).sort() : [],
              endedType: typeof row?.ended,
              interruptedType: typeof row?.is_interrupted
            };
          }
          console.log("HALLOWEEN_STATS_SCHEMA " + JSON.stringify({
            window: { from: start, to: end },
            logPages,
            attackPages,
            logRecords: records.length,
            recordsByType: byType,
            fieldShapes,
            treatAwardDistribution: treatDistribution,
            treatAwardTypeDistribution: treatTypeDistribution,
            exchangeItemTotalsById: itemTotals,
            exchangeItemsShapeDistribution: exchangeItemShape,
            attackRecords: attackRecords.length,
            attackResultDistribution: attackResults,
            modifierNames,
            finishingHitEffectNames,
            attackShape
          }));
          NODE
