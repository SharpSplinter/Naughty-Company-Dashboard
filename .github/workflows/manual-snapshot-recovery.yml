name: Manual Torn snapshot recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naughty-company-manual-snapshot-recovery
  cancel-in-progress: false

jobs:
  recover-global-snapshot:
    name: Fetch, validate, and publish today's global rankings snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate and publish a complete Torn company rankings snapshot
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TORN_API_KEY" || { echo "::error::TORN_API_KEY repository secret is missing."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID repository secret is missing."; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "6c03b978ed9a59adc3f61c715bdad45c" || { echo "::error::Cloudflare account ID does not match the production dashboard account. No snapshot was written."; exit 1; }

          node --input-type=module <<'NODE'
          const apiKey = process.env.TORN_API_KEY;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const cloudflareToken = process.env.CLOUDFLARE_API_TOKEN;
          const databaseId = "bbbe128a-c5cc-46ec-b8ef-93860183e795";
          const d1Base = "https://api.cloudflare.com/client/v4/accounts/" + accountId + "/d1/database/" + databaseId;

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const isRecord = value => value !== null && typeof value === "object" && !Array.isArray(value);
          const positiveId = value => {
            const n = typeof value === "number" ? value : typeof value === "string" && /^\\d+$/.test(value) ? Number(value) : NaN;
            return Number.isSafeInteger(n) && n > 0 ? n : null;
          };
          const numericField = (row, ...names) => {
            for (const name of names) {
              const value = row?.[name];
              if (typeof value === "number" && Number.isFinite(value)) return value;
              if (typeof value === "string" && value.trim() !== "") {
                const n = Number(value.replace(/[$,]/g, ""));
                if (Number.isFinite(n)) return n;
              }
            }
            return null;
          };

          async function tornJson(path) {
            let lastStatus = 0;
            for (let attempt = 0; attempt < 4; attempt++) {
              try {
                const response = await fetch("https://api.torn.com/v2" + path, {
                  headers: { Authorization: "ApiKey " + apiKey, Accept: "application/json" },
                  signal: AbortSignal.timeout(20000),
                });
                lastStatus = response.status;
                const body = await response.text();
                let payload;
                try { payload = JSON.parse(body); } catch { payload = null; }
                if (response.ok && payload && !isRecord(payload.error)) return payload;
                if (response.status < 500 && response.status !== 429) {
                  throw new Error("Torn rejected a request with HTTP " + response.status + ".");
                }
              } catch (error) {
                if (error instanceof Error && error.message.startsWith("Torn rejected")) throw error;
              }
              if (attempt < 3) await sleep(1000 * (attempt + 1));
            }
            throw new Error("Torn snapshot request failed after retries (HTTP " + (lastStatus || "network error") + ").");
          }

          async function cloudflareQuery(sql, params = []) {
            const response = await fetch(d1Base + "/query", {
              method: "POST",
              headers: {
                Authorization: "Bearer " + cloudflareToken,
                "content-type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify({ sql, params: params.map(value => String(value)) }),
              signal: AbortSignal.timeout(60000),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true || !Array.isArray(payload?.result)) {
              throw new Error("Cloudflare D1 query failed (HTTP " + response.status + "); details suppressed.");
            }
            const first = payload.result[0];
            if (!first || first.success !== true || !Array.isArray(first.results)) {
              throw new Error("Cloudflare D1 did not confirm the query; details suppressed.");
            }
            return first.results;
          }

          const capturedAt = new Date().toISOString();
          console.log("Starting manual recovery at " + capturedAt + ". The published timestamp will reflect this recovery, not the missed 18:10 capture time.");

          const catalog = await tornJson("/torn/companies");
          const root = isRecord(catalog)
            ? (Array.isArray(catalog.companies) || isRecord(catalog.companies) ? catalog.companies
              : Array.isArray(catalog.company_types) || isRecord(catalog.company_types) ? catalog.company_types : catalog)
            : catalog;
          const entries = Array.isArray(root) ? root : isRecord(root) ? Object.values(root) : [];
          const byId = new Map();
          for (const entry of entries) {
            if (!isRecord(entry)) continue;
            const id = positiveId(entry.id ?? entry.type_id ?? entry.typeId ?? entry.company_type_id);
            if (!id) continue;
            byId.set(id, { id, name: typeof entry.name === "string" && entry.name.trim() ? entry.name.trim() : "Type #" + id });
          }
          const types = Array.from(byId.values()).sort((a, b) => a.id - b.id);
          if (types.length === 0) throw new Error("Torn returned no valid company types. The existing cache was preserved.");

          async function fetchType(type) {
            const rows = [];
            let expectedTotal = null;
            for (let page = 0; page < 1000; page++) {
              const offset = rows.length;
              const payload = await tornJson("/company/" + type.id + "/companies?offset=" + offset + "&limit=100");
              if (!isRecord(payload) || !Array.isArray(payload.companies) || payload.companies.some(item => !isRecord(item))) {
                throw new Error("Torn returned an invalid company list for type #" + type.id + ". The existing cache was preserved.");
              }
              const pageRows = payload.companies;
              const metadata = isRecord(payload._metadata) ? payload._metadata : {};
              const metadataTotal = numericField(metadata, "total");
              if (metadataTotal !== null) {
                if (expectedTotal !== null && expectedTotal !== metadataTotal) throw new Error("Torn's declared total changed while reading type #" + type.id + ".");
                expectedTotal = metadataTotal;
              }
              rows.push(...pageRows);
              if (expectedTotal !== null) {
                if (rows.length > expectedTotal) throw new Error("Torn returned too many companies for type #" + type.id + ".");
                if (rows.length === expectedTotal) break;
                if (pageRows.length === 0) throw new Error("Torn returned an incomplete page for type #" + type.id + ".");
              } else if (pageRows.length < 100) {
                break;
              }
              if (pageRows.length === 0) break;
              if (page === 999) throw new Error("Pagination limit reached for type #" + type.id + ".");
            }
            if (expectedTotal !== null && rows.length !== expectedTotal) throw new Error("Torn returned an incomplete company list for type #" + type.id + ".");
            return { type, rows };
          }

          const collected = [];
          for (let i = 0; i < types.length; i += 4) {
            const batch = await Promise.all(types.slice(i, i + 4).map(fetchType));
            for (const group of batch) {
              for (const row of group.rows) collected.push({ row, typeId: group.type.id, typeName: group.type.name });
            }
            console.log("Validated " + Math.min(i + 4, types.length) + " of " + types.length + " company types.");
          }

          if (collected.length === 0) throw new Error("Torn returned no companies. The existing cache was preserved.");
          const companies = collected.flatMap(({ row, typeId, typeName }) => {
            const companyId = positiveId(row.id ?? row.company_id ?? row.companyId ?? row.ID);
            if (!companyId) return [];
            const type = isRecord(row.type) ? row.type : {};
            const income = isRecord(row.income) ? row.income : {};
            const director = isRecord(row.director) ? row.director : {};
            const typeNameFromRow = typeof type.name === "string" && type.name.trim() ? type.name.trim() : typeName;
            const rowTypeId = positiveId(type.id ?? row.company_type_id ?? row.companyTypeId);
            const weeklyIncome = numericField(income, "weekly") ?? numericField(row, "weekly_income", "weeklyIncome");
            const dailyIncome = numericField(income, "daily") ?? numericField(row, "daily_income", "dailyIncome");
            return [{
              companyId,
              companyName: typeof row.name === "string" && row.name.trim() ? row.name : "Company #" + companyId,
              companyType: typeNameFromRow,
              companyTypeId: rowTypeId ?? typeId,
              starRating: numericField(row, "rating", "stars", "star_rating"),
              weeklyIncome,
              dailyIncome,
              averageDailyIncome: weeklyIncome === null ? null : weeklyIncome / 7,
              directorName: typeof director.name === "string" ? director.name : "",
              playerId: "torn-global",
              fetchedAt: capturedAt,
            }];
          }).sort((a, b) => Number(b.weeklyIncome ?? -1) - Number(a.weeklyIncome ?? -1));

          if (companies.length !== collected.length) throw new Error("Some Torn company rows had invalid IDs. The existing cache was preserved.");
          const uniqueIds = new Set(companies.map(company => String(company.companyId)));
          if (uniqueIds.size !== companies.length) throw new Error("Torn returned duplicate company IDs. The existing cache was preserved.");
          if (companies.length < 1000) throw new Error("The company dataset is unexpectedly small. The existing cache was preserved.");

          console.log("Complete dataset validated: " + types.length + " company types, " + companies.length + " unique companies.");

          await cloudflareQuery(
            "INSERT INTO global_rankings_cache (cache_id, companies_json, fetched_at) VALUES (1, ?, ?) ON CONFLICT(cache_id) DO UPDATE SET companies_json = excluded.companies_json, fetched_at = excluded.fetched_at",
            [JSON.stringify(companies), capturedAt],
          );

          const verified = await cloudflareQuery(
            "SELECT fetched_at, json_array_length(companies_json) AS company_count FROM global_rankings_cache WHERE cache_id = 1",
          );
          if (verified.length !== 1 || verified[0].fetched_at !== capturedAt || Number(verified[0].company_count) !== companies.length) {
            throw new Error("Post-write verification did not match the fetched dataset.");
          }
          console.log("RECOVERY_VERIFIED fetched_at=" + verified[0].fetched_at + " company_count=" + verified[0].company_count + ".");
          console.log("Shared global rankings cache now contains today's validated Torn company data.");
          NODE