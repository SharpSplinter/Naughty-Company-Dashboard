name: Manual Cloudflare Pages Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run regression tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://naughty-company-api.kboone801.workers.dev

      - name: Deploy to production Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=naughty-company-dashboard --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
