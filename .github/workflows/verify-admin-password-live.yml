name: Verify production administrator sign-in credential

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naughty-company-admin-credential-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Test current one-shot credential against production verifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify current production credential without changing secrets
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
          ADMIN_USERNAME_ONESHOT: ${{ secrets.ADMIN_USERNAME_ONESHOT }}
          ADMIN_PASSWORD_ONESHOT: ${{ secrets.ADMIN_PASSWORD_ONESHOT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TORN_API_KEY" || { echo "::error::TORN_API_KEY repository secret is missing."; exit 1; }
          test -n "$ADMIN_USERNAME_ONESHOT" || { echo "::error::ADMIN_USERNAME_ONESHOT repository secret is missing."; exit 1; }
          test -n "$ADMIN_PASSWORD_ONESHOT" || { echo "::error::ADMIN_PASSWORD_ONESHOT repository secret is missing."; exit 1; }

          node --input-type=module <<'NODE'
          const base = "https://naughty-company-api.kboone801.workers.dev";
          const apiKey = process.env.TORN_API_KEY;
          const username = process.env.ADMIN_USERNAME_ONESHOT;
          const password = process.env.ADMIN_PASSWORD_ONESHOT;
          let token = "";
          let elevated = false;
          let failed = false;

          try {
            const loginResponse = await fetch(`${base}/api/auth/sign-in`, {
              method: "POST",
              headers: { "content-type": "application/json", accept: "application/json" },
              body: JSON.stringify({ apiKey }),
              signal: AbortSignal.timeout(15000),
            });
            const login = await loginResponse.json().catch(() => null);
            if (!loginResponse.ok || typeof login?.token !== "string") {
              console.error(`Live owner-session sign-in failed: HTTP ${loginResponse.status}; response suppressed.`);
              failed = true;
            } else {
              token = login.token;
              const sessionResponse = await fetch(`${base}/api/auth/session`, {
                headers: { authorization: `Bearer ${token}`, accept: "application/json" },
                signal: AbortSignal.timeout(15000),
              });
              const session = await sessionResponse.json().catch(() => null);
              if (!sessionResponse.ok || session?.player?.id !== "351311") {
                console.error(`Live test session is not the allowlisted owner: HTTP ${sessionResponse.status}; ownerIdentity=${session?.player?.id === "351311"}.`);
                failed = true;
              } else {
                const elevationResponse = await fetch(`${base}/api/auth/admin/elevate`, {
                  method: "POST",
                  headers: {
                    authorization: `Bearer ${token}`,
                    "content-type": "application/json",
                    accept: "application/json",
                  },
                  body: JSON.stringify({ username, password }),
                  signal: AbortSignal.timeout(15000),
                });
                const elevation = await elevationResponse.json().catch(() => null);
                if (!elevationResponse.ok || elevation?.isAdmin !== true || typeof elevation?.adminElevatedUntil !== "number") {
                  const diagnostic = typeof elevation?.diagnostic === "string" ? elevation.diagnostic : "not_provided";
                  console.error(`Live production verifier rejected the exact one-shot credential: HTTP ${elevationResponse.status}; diagnostic=${diagnostic}. Credential values were not logged.`);
                  failed = true;
                } else {
                  elevated = true;
                  console.log("Live production verifier accepted the current one-shot credential.");
                }
              }
            }
          } catch {
            console.error("Live production credential verification encountered a network or response error; details suppressed.");
            failed = true;
          } finally {
            if (token && elevated) {
              try {
                const response = await fetch(`${base}/api/auth/admin/de-elevate`, {
                  method: "POST",
                  headers: { authorization: `Bearer ${token}`, accept: "application/json" },
                  signal: AbortSignal.timeout(10000),
                });
                console.log(`Test-session administrator revocation -> HTTP ${response.status}.`);
                if (!response.ok) failed = true;
              } catch {
                console.error("Could not confirm test-session revocation; sign-out will still be attempted.");
                failed = true;
              }
            }
            if (token) {
              try {
                const response = await fetch(`${base}/api/auth/sign-out`, {
                  method: "POST",
                  headers: { authorization: `Bearer ${token}`, accept: "application/json" },
                  signal: AbortSignal.timeout(10000),
                });
                console.log(`Test-session sign-out -> HTTP ${response.status}.`);
                if (!response.ok) failed = true;
              } catch {
                console.error("Could not confirm test-session sign-out.");
                failed = true;
              }
            }
          }
          if (failed) process.exitCode = 1;
          NODE
