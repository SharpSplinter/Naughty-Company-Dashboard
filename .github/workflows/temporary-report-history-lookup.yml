name: Temporary read-only report history lookup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-report-history:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query saved delivery and daily snapshot history (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c03b978ed9a59adc3f61c715bdad45c
          DASHBOARD_DATABASE_ID: bbbe128a-c5cc-46ec-b8ef-93860183e795
          BOT_DATABASE_ID: 46f7536d-f69c-4304-8b44-615901c60b7c
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token) throw new Error("CLOUDFLARE_API_TOKEN is not configured.");
          const endpoint = id => `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${id}/query`;
          async function query(databaseId, sql) {
            const response = await fetch(endpoint(databaseId), {
              method: "POST",
              headers: { authorization: `Bearer ${token}`, "content-type": "application/json" },
              body: JSON.stringify({ sql })
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const messages = (payload.errors || []).map(error => error.message).join("; ");
              throw new Error(`Read-only D1 query failed (HTTP ${response.status}): ${messages || "unspecified API error"}`);
            }
            const result = Array.isArray(payload.result) ? payload.result[0] : payload.result;
            if (!result || !Array.isArray(result.results)) throw new Error("D1 query response did not contain rows.");
            return result.results;
          }
          const botId = process.env.BOT_DATABASE_ID;
          const dashboardId = process.env.DASHBOARD_DATABASE_ID;
          const linkRows = await query(botId,
            "SELECT dashboard_player_id AS playerId, substr(discord_user_id, -4) AS accountSuffix " +
            "FROM discord_links WHERE substr(discord_user_id, -4) = '7024' LIMIT 2");
          if (linkRows.length !== 1 || !/^[0-9]+$/.test(String(linkRows[0].playerId))) {
            throw new Error("Expected one linked dashboard account for the previously confirmed masked Discord suffix.");
          }
          const playerId = String(linkRows[0].playerId);
          const dashboardSql = `
          WITH target AS (
            SELECT DISTINCT player_id, company_id, company_name FROM (
              SELECT player_id, company_id, company_name FROM companies
              WHERE player_id = '${playerId}' AND lower(company_name) LIKE '%knotty oil%'
              UNION ALL
              SELECT player_id, company_id, company_name FROM faction_member_cache
              WHERE player_id = '${playerId}' AND lower(company_name) LIKE '%knotty oil%'
            )
          ),
          history AS (
            SELECT 'director-lockin' AS source, t.company_name AS companyName, t.company_id AS companyId,
              t.player_id AS playerKey, d.snapshot_day AS reportingDay, d.fetched_at AS fetchedAt,
              d.snapshot_kind AS snapshotKind, d.profile_json AS profileJson, d.stock_json AS stockJson,
              NULL AS employeesJson, NULL AS snapshotId
            FROM faction_director_snapshots d JOIN target t
              ON t.player_id = d.player_id AND t.company_id = d.company_id
            WHERE d.snapshot_day IN ('2026-10-19', '2026-10-20')
            UNION ALL
            SELECT 'profile' AS source, t.company_name AS companyName, t.company_id AS companyId,
              t.player_id AS playerKey, date(s.fetched_at, '-18 hours') AS reportingDay, s.fetched_at AS fetchedAt,
              NULL AS snapshotKind, s.profile_json AS profileJson, NULL AS stockJson,
              s.employees_json AS employeesJson, s.snapshot_id AS snapshotId
            FROM company_snapshots s JOIN target t
              ON t.player_id = s.player_id AND t.company_id = s.company_id
            WHERE date(s.fetched_at, '-18 hours') IN ('2026-10-19', '2026-10-20')
            UNION ALL
            SELECT 'financial' AS source, t.company_name AS companyName, t.company_id AS companyId,
              t.player_id AS playerKey, date(f.fetched_at, '-18 hours') AS reportingDay, f.fetched_at AS fetchedAt,
              NULL AS snapshotKind, NULL AS profileJson, f.stock_json AS stockJson,
              NULL AS employeesJson, f.snapshot_id AS snapshotId
            FROM company_financial_snapshots f JOIN target t
              ON t.player_id = f.player_id AND t.company_id = f.company_id
            WHERE date(f.fetched_at, '-18 hours') IN ('2026-10-19', '2026-10-20')
          )
          SELECT * FROM history ORDER BY reportingDay ASC, source ASC, fetchedAt ASC`;
          const rows = await query(dashboardId, dashboardSql);
          const isRecord = value => value !== null && typeof value === "object" && !Array.isArray(value);
          const number = value => typeof value === "number" && Number.isFinite(value) ? value : null;
          const parse = value => { try { return typeof value === "string" ? JSON.parse(value) : value; } catch { return null; } };
          const rootOf = value => {
            if (!isRecord(value)) return {};
            if (isRecord(value.company)) return value.company;
            if (isRecord(value.profile)) return isRecord(value.profile.profile) ? value.profile.profile : value.profile;
            return value;
          };
          const dailyIncomeOf = value => {
            const root = rootOf(value);
            return number(isRecord(root.income) ? root.income.daily : null) ?? number(root.daily_income);
          };
          const dailyProfitOf = value => {
            const root = rootOf(value);
            const profit = isRecord(root.profit) ? root.profit.daily : null;
            return number(profit) ?? number(root.daily_profit) ?? number(root.dailyProfit) ?? number(root.profit_daily);
          };
          function recursiveNumberByKeys(value, keys, depth = 0) {
            if (depth > 6) return null;
            if (Array.isArray(value)) {
              for (const child of value) { const found = recursiveNumberByKeys(child, keys, depth + 1); if (found !== null) return found; }
              return null;
            }
            if (!isRecord(value)) return null;
            for (const key of keys) if (typeof value[key] === "number" && Number.isFinite(value[key])) return Math.max(0, value[key]);
            for (const child of Object.values(value)) { const found = recursiveNumberByKeys(child, keys, depth + 1); if (found !== null) return found; }
            return null;
          }
          function employeesWages(value) {
            const payload = parse(value);
            if (isRecord(payload) && payload.reconstructed === true && isRecord(payload.wage_reconstruction)) {
              const a = payload.wage_reconstruction;
              const wages = number(a.total_wages), income = number(a.daily_income), profit = number(a.daily_profit), ads = number(a.advertising_budget), order = number(a.stock_order_expense);
              if (wages !== null && wages >= 0 && Number.isInteger(wages) && income !== null && profit !== null && ads !== null && order !== null &&
                  typeof a.source === "string" && a.source.trim() && a.method === "daily-income-minus-daily-profit-minus-advertising-budget-minus-stock-order-expense" &&
                  wages === income - profit - ads - order) return wages;
            }
            let staff = [];
            if (Array.isArray(payload)) staff = payload;
            else if (isRecord(payload) && Array.isArray(payload.employees)) staff = payload.employees;
            else if (isRecord(payload) && isRecord(payload.employees) && Array.isArray(payload.employees.employees)) staff = payload.employees.employees;
            else return null;
            if (staff.some(employee => !isRecord(employee) || number(employee.wage) === null || employee.wage < 0)) return null;
            return staff.reduce((sum, employee) => sum + number(employee.wage), 0);
          }
          function stockInfo(value) {
            const stock = parse(value);
            const items = Array.isArray(stock) ? stock : (isRecord(stock) && Array.isArray(stock.stock) ? stock.stock : null);
            if (!items || !items.length) return { itemCount: items ? items.length : null, unknownQuantityItems: null, quantity: null };
            const quantities = items.map(item => isRecord(item) ? [item.in_stock, item.quantity, item.amount].find(v => number(v) !== null) : null);
            const missing = quantities.filter(v => number(v) === null).length;
            return { itemCount: items.length, unknownQuantityItems: missing, quantity: missing === 0 ? quantities.reduce((sum, value) => sum + Number(value), 0) : null };
          }
          function stockOrderExpense(value) {
            const stock = parse(value);
            if (stock === null || (!isRecord(stock) && !Array.isArray(stock))) return null;
            const found = [];
            function visit(value, depth = 0, label = "") {
              if (!value || typeof value !== "object" || depth > 7) return;
              if (Array.isArray(value)) { value.forEach((child, i) => visit(child, depth + 1, String(i + 1))); return; }
              const own = key => Object.prototype.hasOwnProperty.call(value, key);
              const n = v => typeof v === "number" && Number.isFinite(v) ? v : (typeof v === "string" && v.trim() && Number.isFinite(Number(v)) ? Number(v) : null);
              const unitCost = n(value.cost) ?? n(value.unit_cost) ?? n(value.cost_per_unit) ?? n(value.purchase_price);
              const hasCost = ["cost", "unit_cost", "cost_per_unit", "purchase_price"].some(own);
              const hasOrder = ["on_order", "onOrder"].some(own);
              const hasInventory = ["in_stock", "quantity", "amount", "price", "rrp"].some(own);
              if (hasOrder || (hasCost && hasInventory)) {
                found.push({ order: n(value.on_order) ?? n(value.onOrder), unitCost, rawCost: value.cost });
                return;
              }
              for (const [key, child] of Object.entries(value)) if (child && typeof child === "object") visit(child, depth + 1, key);
            }
            visit(stock);
            let total = 0;
            for (const row of found) {
              const nonOrderable = typeof row.rawCost === "string" && /cannot be ordered/i.test(row.rawCost);
              if (row.order === null) { if (nonOrderable || row.unitCost === 0) continue; return null; }
              const order = Math.max(0, row.order);
              if (order === 0) continue;
              if (row.unitCost === null) return null;
              total += order * Math.max(0, row.unitCost);
            }
            return total;
          }
          const targetSummary = Array.from(new Map(rows.map(row => [String(row.playerKey) + ":" + String(row.companyId), { companyName: row.companyName, companyId: row.companyId }])).values());
          if (!targetSummary.length) throw new Error("No saved Knotty Oil company history was found for the linked dashboard account.");
          const reports = [];
          for (const day of ["2026-10-19", "2026-10-20"]) {
            const dayRows = rows.filter(row => row.reportingDay === day);
            const lockins = dayRows.filter(row => row.source === "director-lockin");
            const profiles = dayRows.filter(row => row.source === "profile").sort((a,b) => String(a.fetchedAt).localeCompare(String(b.fetchedAt)));
            const financials = dayRows.filter(row => row.source === "financial").sort((a,b) => String(b.fetchedAt).localeCompare(String(a.fetchedAt)));
            const chosenProfile = profiles.at(-1);
            const chosenFinancial = financials[0];
            const profile = chosenProfile ? parse(chosenProfile.profileJson) : null;
            const income = chosenProfile ? dailyIncomeOf(profile) : null;
            const directProfit = chosenProfile ? dailyProfitOf(profile) : null;
            const advertisingBudget = chosenProfile ? recursiveNumberByKeys(profile, ["advertisement_budget","advertising_budget","advertising_budget_daily","ad_budget","daily_ad_budget","advertising"]) : null;
            const wages = chosenProfile ? employeesWages(chosenProfile.employeesJson) : null;
            const orderExpense = chosenFinancial ? stockOrderExpense(chosenFinancial.stockJson) : null;
            const reconstructedProfit = directProfit !== null ? directProfit : (
              income !== null && advertisingBudget !== null && wages !== null && orderExpense !== null
                ? income - advertisingBudget - wages - orderExpense : null);
            const officialStock = lockins.sort((a,b) => String(a.fetchedAt).localeCompare(String(b.fetchedAt))).at(-1);
            const stock = officialStock ? stockInfo(officialStock.stockJson) : {itemCount:null,unknownQuantityItems:null,quantity:null};
            reports.push({
              reportingDay: day,
              officialLockinRows: lockins.length,
              officialLockin: officialStock ? { fetchedAt: officialStock.fetchedAt, kind: officialStock.snapshotKind, stockItemCount: stock.itemCount, stockItemsWithUnknownQuantity: stock.unknownQuantityItems, stockQuantity: stock.quantity } : null,
              profileSnapshotRows: profiles.length,
              selectedProfileFetchedAt: chosenProfile?.fetchedAt ?? null,
              dailyIncome: income,
              directDailyProfitInSavedProfile: directProfit,
              advertisingBudget: advertisingBudget,
              employeeWagesKnownTotal: wages,
              stockOrderExpense: orderExpense,
              dailyProfitAccordingToTrendsInputs: reconstructedProfit,
              selectedFinancialFetchedAt: chosenFinancial?.fetchedAt ?? null,
              financialSnapshotRows: financials.length
            });
          }
          const deliveryRows = await query(botId,
            "SELECT substr(discord_user_id, -4) AS accountSuffix, reporting_day AS reportingDay, status, attempts, updated_at AS updatedAt " +
            "FROM discord_daily_summary_deliveries WHERE substr(discord_user_id, -4) = '7024' " +
            "AND reporting_day IN ('2026-10-19', '2026-10-20') ORDER BY reporting_day");
          const stateRows = await query(botId,
            "SELECT substr(discord_user_id, -4) AS accountSuffix, company_id AS companyId, snapshot_day AS snapshotDay, metrics_json AS metricsJson, updated_at AS updatedAt " +
            "FROM discord_daily_company_summary_state WHERE substr(discord_user_id, -4) = '7024'");
          const state = stateRows.map(row => {
            const metrics = parse(row.metricsJson) || {};
            return {
              accountSuffix: row.accountSuffix, companyId: row.companyId, snapshotDay: row.snapshotDay, updatedAt: row.updatedAt,
              dailyIncome: number(metrics.dailyIncome), dailyProfit: number(metrics.dailyProfit), stockQuantity: number(metrics.stockQuantity)
            };
          });
          console.log("READ_ONLY_REPORT_HISTORY_RESULT=" + JSON.stringify({
            company: targetSummary,
            trendHistory: reports,
            discordDeliveryLedger: deliveryRows,
            latestDiscordSummaryState: state
          }));
          NODE
