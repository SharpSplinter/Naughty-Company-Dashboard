name: Read-only staging D1 chart history inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-staging-chart-history:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect saved stock-array structure for Knotty Oil
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "6c03b978ed9a59adc3f61c715bdad45c"
          STAGING_D1_DATABASE_ID: "1e37f1a5-daa3-41fb-8c1b-7a9c6e3d0405"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi
          response_file="$(mktemp)"
          request_file="$(mktemp)"
          trap 'rm -f "$response_file" "$request_file"' EXIT
          jq -n --arg sql "SELECT s.snapshot_day, s.fetched_at, json_array_length(s.stock_json, '$.stock') AS stock_item_count, json_extract(s.stock_json, '$.stock[0]') AS first_stock_item FROM faction_director_snapshots s WHERE s.company_id = '96639' AND s.snapshot_day IN ('2026-10-11','2026-10-12') ORDER BY s.snapshot_day" '{sql: $sql}' > "$request_file"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@$request_file" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${STAGING_D1_DATABASE_ID}/query")"
          unset CLOUDFLARE_API_TOKEN
          if [[ "$status" != "200" ]] || ! jq -e '.success == true' "$response_file" >/dev/null; then
            echo "::error::Cloudflare D1 stock-array query failed (HTTP $status). Response body suppressed."
            exit 1
          fi
          echo "Read-only stock-array structure for the two saved snapshots:"
          jq -c '[.result[]?.results[]? | {snapshot_day: .snapshot_day, fetched_at: .fetched_at, stock_item_count: .stock_item_count, first_stock_item: .first_stock_item}]' "$response_file"
