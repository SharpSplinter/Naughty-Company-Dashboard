name: Read-only staging D1 schema inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-staging-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect staging API database schema only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "6c03b978ed9a59adc3f61c715bdad45c"
          STAGING_D1_DATABASE_ID: "1e37f1a5-daa3-41fb-8c1b-7a9c6e3d0405"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"sql":"SELECT name, sql FROM sqlite_master WHERE type = ''table'' ORDER BY name"}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${STAGING_D1_DATABASE_ID}/query")"
          unset CLOUDFLARE_API_TOKEN
          if [[ "$status" != "200" ]] || ! jq -e '.success == true' "$response_file" >/dev/null; then
            echo "::error::Cloudflare D1 schema query failed (HTTP $status). Response body suppressed."
            exit 1
          fi
          echo "Read-only schema inspection succeeded. Table names and CREATE TABLE statements:"
          jq -c '[.result[]?.results[]? | {name: .name, sql: .sql}]' "$response_file"
