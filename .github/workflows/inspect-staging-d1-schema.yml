name: Read-only staging D1 chart history inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-staging-chart-history:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Knotty Oil stock snapshot fields only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "6c03b978ed9a59adc3f61c715bdad45c"
          STAGING_D1_DATABASE_ID: "1e37f1a5-daa3-41fb-8c1b-7a9c6e3d0405"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi
          response_file="$(mktemp)"
          request_file="$(mktemp)"
          trap 'rm -f "$response_file" "$request_file"' EXIT
          jq -n --arg sql "SELECT p.player_name, c.company_name, s.company_id, s.snapshot_day, s.fetched_at, j.key AS stock_field, j.type AS field_type, CASE WHEN j.type IN ('integer','real','text') THEN j.value ELSE NULL END AS field_value FROM faction_director_snapshots s JOIN players p ON p.player_id = s.player_id LEFT JOIN companies c ON c.player_id = s.player_id AND c.company_id = s.company_id JOIN json_each(s.stock_json) j WHERE s.company_id = '96639' AND s.snapshot_day IN ('2026-10-11','2026-10-12') ORDER BY s.snapshot_day, j.key" '{sql: $sql}' > "$request_file"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@$request_file" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${STAGING_D1_DATABASE_ID}/query")"
          unset CLOUDFLARE_API_TOKEN
          if [[ "$status" != "200" ]] || ! jq -e '.success == true' "$response_file" >/dev/null; then
            echo "::error::Cloudflare D1 stock-field query failed (HTTP $status). Response body suppressed."
            exit 1
          fi
          echo "Read-only stock snapshot fields for company 96639 on Oct 11 and Oct 12:"
          jq -c '[.result[]?.results[]? | {player_name: .player_name, company_name: .company_name, company_id: .company_id, snapshot_day: .snapshot_day, fetched_at: .fetched_at, stock_field: .stock_field, field_type: .field_type, field_value: .field_value}]' "$response_file"
