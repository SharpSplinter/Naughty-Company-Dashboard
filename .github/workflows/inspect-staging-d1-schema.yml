name: Read-only staging D1 chart history inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-staging-chart-history:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Knotty Oil saved snapshot metadata only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "6c03b978ed9a59adc3f61c715bdad45c"
          STAGING_D1_DATABASE_ID: "1e37f1a5-daa3-41fb-8c1b-7a9c6e3d0405"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi
          response_file="$(mktemp)"
          request_file="$(mktemp)"
          trap 'rm -f "$response_file" "$request_file"' EXIT
          jq -n --arg sql "SELECT 'faction_director_snapshots' AS source, snapshot_day AS day, fetched_at, company_id, json_type(stock_json) AS stock_json_type, length(stock_json) AS stock_json_length FROM faction_director_snapshots WHERE instr(profile_json, 'Knotty Oil') > 0 OR instr(stock_json, 'Knotty Oil') > 0 ORDER BY snapshot_day DESC LIMIT 30" '{sql: $sql}' > "$request_file"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@$request_file" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${STAGING_D1_DATABASE_ID}/query")"
          unset CLOUDFLARE_API_TOKEN
          if [[ "$status" != "200" ]] || ! jq -e '.success == true' "$response_file" >/dev/null; then
            echo "::error::Cloudflare D1 saved-snapshot metadata query failed (HTTP $status). Response body suppressed."
            exit 1
          fi
          echo "Read-only saved-snapshot metadata results:"
          jq -c '[.result[]?.results[]? | {source: .source, day: .day, fetched_at: .fetched_at, company_id: .company_id, stock_json_type: .stock_json_type, stock_json_length: .stock_json_length}]' "$response_file"
