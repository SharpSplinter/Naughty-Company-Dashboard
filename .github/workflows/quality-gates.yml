name: Quality gates

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, production build, and backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check admin recovery helper syntax
        run: node --check scripts/update-admin-password-hash.mjs
      - name: Check admin recovery helper imports
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { resolve } from "node:path";
          import { pathToFileURL } from "node:url";

          const helperUrl = pathToFileURL(resolve("scripts/update-admin-password-hash.mjs"));
          const source = await readFile(helperUrl, "utf8");
          const expectedImport = 'import { validateAdminPassword } from "../src/lib/admin-password-policy.js";';
          if (!source.includes(expectedImport)) {
            throw new Error("The recovery helper password-policy import path is incorrect.");
          }
          const policyModule = await import(new URL("../src/lib/admin-password-policy.js", helperUrl).href);
          if (typeof policyModule.validateAdminPassword !== "function") {
            throw new Error("The recovery helper's password-policy import does not export validateAdminPassword.");
          }
          const result = policyModule.validateAdminPassword("Harbor!582Lake");
          if (!result || result.valid !== true) throw new Error("The recovery helper password-policy smoke test failed.");
          console.log("Admin recovery policy import and password-policy smoke test passed.");
          NODE
      - name: Type-check application
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Run backend regression suite
        run: npm test
