name: Quality gates

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, production build, and backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check administrator role registry contract
        run: node scripts/test-admin-role-registry.mjs
      - name: Type-check application
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Check staging integration harness syntax
        run: |
          node --check scripts/ensure-faction-performance-integration-queues.mjs
          node --check scripts/run-faction-performance-staging-integration.mjs
      - name: Run backend regression suite
        run: npm test
