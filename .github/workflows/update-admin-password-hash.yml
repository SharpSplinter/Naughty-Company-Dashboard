name: Update production administrator password hash

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naughty-company-admin-hash-update
  cancel-in-progress: false

jobs:
  update-secret:
    name: Update ADMIN_PASSWORD_HASH on production API Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Cloudflare account matches the production Worker hostname
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID repository secret is missing."; exit 1; }

          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const expectedSubdomain = "kboone801";
          let response;
          let payload;
          try {
            response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/subdomain`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            payload = await response.json();
          } catch {
            console.error("Could not verify the Cloudflare account's Workers subdomain. No secret was changed.");
            process.exit(1);
          }

          if (!response.ok || payload?.success !== true || payload?.result?.subdomain !== expectedSubdomain) {
            console.error("CLOUDFLARE_ACCOUNT_ID does not verify as the production workers.dev account (expected subdomain kboone801). No secret was changed.");
            process.exit(1);
          }
          console.log("Cloudflare account verified against production workers.dev subdomain kboone801.");
          NODE

      - name: Hash the one-shot password and update the Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD_ONESHOT: ${{ secrets.ADMIN_PASSWORD_ONESHOT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID repository secret is missing."; exit 1; }
          test -n "$ADMIN_PASSWORD_ONESHOT" || { echo "::error::ADMIN_PASSWORD_ONESHOT repository secret is missing."; exit 1; }

          node --input-type=module <<'NODE'
          import { pbkdf2Sync, randomBytes } from "node:crypto";
          import { spawnSync } from "node:child_process";
          import { validateAdminPassword } from "./src/lib/admin-password-policy.js";

          const password = process.env.ADMIN_PASSWORD_ONESHOT ?? "";
          if (!password) {
            console.error("ADMIN_PASSWORD_ONESHOT is missing; no password value was displayed.");
            process.exit(1);
          }
          if (/[\u0000-\u001f\u007f]/u.test(password) || password !== password.trim()) {
            console.error("Use a single-line passphrase without leading or trailing whitespace.");
            process.exit(1);
          }
          const policy = validateAdminPassword(password);
          if (!policy.valid) {
            console.error(`ADMIN_PASSWORD_ONESHOT fails the current password policy: ${policy.reason}`);
            process.exit(1);
          }

          const salt = randomBytes(16);
          const digest = pbkdf2Sync(password, salt, 210000, 32, "sha256");
          const encodedHash = [
            "pbkdf2-sha256",
            "210000",
            salt.toString("base64"),
            digest.toString("base64"),
          ].join("$");

          // Do not pass the raw password to Wrangler or any child process.
          delete process.env.ADMIN_PASSWORD_ONESHOT;
          const result = spawnSync(
            "npx",
            ["--yes", "wrangler@4.151.3", "secret", "put", "ADMIN_PASSWORD_HASH", "--config", "wrangler.toml"],
            { input: encodedHash + "\n", encoding: "utf8", stdio: ["pipe", "inherit", "inherit"] },
          );
          if (result.error) {
            console.error("Wrangler could not be started; the password and hash were not displayed.");
            process.exit(1);
          }
          if (result.status !== 0) {
            console.error("Cloudflare did not confirm the update. Keep the one-shot Actions secret until the failure is resolved.");
            process.exit(result.status ?? 1);
          }
          console.log("Cloudflare confirmed the administrator hash update. Password and hash were not displayed.");
          NODE

      - name: Verify the new credential against the live production API
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
          ADMIN_USERNAME_ONESHOT: ${{ secrets.ADMIN_USERNAME_ONESHOT }}
          ADMIN_PASSWORD_ONESHOT: ${{ secrets.ADMIN_PASSWORD_ONESHOT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TORN_API_KEY" || { echo "::error::TORN_API_KEY repository secret is missing."; exit 1; }
          test -n "$ADMIN_USERNAME_ONESHOT" || { echo "::error::ADMIN_USERNAME_ONESHOT repository secret is missing."; exit 1; }
          test -n "$ADMIN_PASSWORD_ONESHOT" || { echo "::error::ADMIN_PASSWORD_ONESHOT repository secret is missing."; exit 1; }

          node --input-type=module <<'NODE'
          const base = "https://naughty-company-api.kboone801.workers.dev";
          // secret put creates a new live Worker deployment; allow edge propagation before probing it.
          await new Promise((resolve) => setTimeout(resolve, 10000));
          const apiKey = process.env.TORN_API_KEY;
          const username = process.env.ADMIN_USERNAME_ONESHOT;
          const password = process.env.ADMIN_PASSWORD_ONESHOT;
          let token = "";
          let elevated = false;
          let failed = false;

          try {
            const loginResponse = await fetch(`${base}/api/auth/sign-in`, {
              method: "POST",
              headers: { "content-type": "application/json", accept: "application/json" },
              body: JSON.stringify({ apiKey }),
              signal: AbortSignal.timeout(15000),
            });
            const login = await loginResponse.json().catch(() => null);
            if (!loginResponse.ok || typeof login?.token !== "string") {
              console.error(`Live owner-session sign-in failed: HTTP ${loginResponse.status}; response suppressed.`);
              failed = true;
            } else {
              token = login.token;
              const sessionResponse = await fetch(`${base}/api/auth/session`, {
                headers: { authorization: `Bearer ${token}`, accept: "application/json" },
                signal: AbortSignal.timeout(15000),
              });
              const session = await sessionResponse.json().catch(() => null);
              if (!sessionResponse.ok || session?.player?.id !== "351311") {
                console.error(`Live test session is not the allowlisted owner: HTTP ${sessionResponse.status}; ownerIdentity=${session?.player?.id === "351311"}.`);
                failed = true;
              } else {
                const elevationResponse = await fetch(`${base}/api/auth/admin/elevate`, {
                  method: "POST",
                  headers: {
                    authorization: `Bearer ${token}`,
                    "content-type": "application/json",
                    accept: "application/json",
                  },
                  body: JSON.stringify({ username, password }),
                  signal: AbortSignal.timeout(15000),
                });
                const elevation = await elevationResponse.json().catch(() => null);
                if (!elevationResponse.ok || elevation?.isAdmin !== true || typeof elevation?.adminElevatedUntil !== "number") {
                  const diagnostic = typeof elevation?.diagnostic === "string" ? elevation.diagnostic : "not_provided";
                  console.error(`Live production verifier rejected the exact one-shot credential: HTTP ${elevationResponse.status}; diagnostic=${diagnostic}. Credential values were not logged.`);
                  failed = true;
                } else {
                  elevated = true;
                  console.log("Live production verifier accepted the one-shot credential.");
                }
              }
            }
          } catch {
            console.error("Live production credential verification encountered a network or response error; details suppressed.");
            failed = true;
          } finally {
            if (token && elevated) {
              try {
                const response = await fetch(`${base}/api/auth/admin/de-elevate`, {
                  method: "POST",
                  headers: { authorization: `Bearer ${token}`, accept: "application/json" },
                  signal: AbortSignal.timeout(10000),
                });
                console.log(`Test-session administrator revocation -> HTTP ${response.status}.`);
                if (!response.ok) failed = true;
              } catch {
                console.error("Could not confirm test-session revocation; sign-out will still be attempted.");
                failed = true;
              }
            }
            if (token) {
              try {
                const response = await fetch(`${base}/api/auth/sign-out`, {
                  method: "POST",
                  headers: { authorization: `Bearer ${token}`, accept: "application/json" },
                  signal: AbortSignal.timeout(10000),
                });
                console.log(`Test-session sign-out -> HTTP ${response.status}.`);
                if (!response.ok) failed = true;
              } catch {
                console.error("Could not confirm test-session sign-out.");
                failed = true;
              }
            }
          }
          if (failed) process.exitCode = 1;
          NODE
