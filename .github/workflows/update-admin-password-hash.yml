name: Update production administrator password hash

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naughty-company-admin-hash-update
  cancel-in-progress: false

jobs:
  update-secret:
    name: Update ADMIN_PASSWORD_HASH on production API Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate supplied hash format without displaying it
        env:
          ADMIN_PASSWORD_HASH_ONESHOT: ${{ secrets.ADMIN_PASSWORD_HASH_ONESHOT }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const encoded = process.env.ADMIN_PASSWORD_HASH_ONESHOT ?? "";
          const parts = encoded.split("$");
          if (parts.length !== 4 || parts[0] !== "pbkdf2-sha256" || parts[1] !== "210000") {
            console.error("ADMIN_PASSWORD_HASH_ONESHOT is missing or has an unexpected format.");
            process.exit(1);
          }
          try {
            const salt = Buffer.from(parts[2], "base64");
            const digest = Buffer.from(parts[3], "base64");
            if (salt.length < 16 || digest.length !== 32 ||
                salt.toString("base64") !== parts[2] ||
                digest.toString("base64") !== parts[3]) {
              throw new Error("invalid hash encoding");
            }
          } catch {
            console.error("ADMIN_PASSWORD_HASH_ONESHOT failed format validation; its value is not printed.");
            process.exit(1);
          }
          console.log("Password hash format validated; value not displayed.");
          NODE

      - name: Update and deploy only the production API Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD_HASH_ONESHOT: ${{ secrets.ADMIN_PASSWORD_HASH_ONESHOT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing."; exit 1; }
          test -n "$ADMIN_PASSWORD_HASH_ONESHOT" || { echo "::error::ADMIN_PASSWORD_HASH_ONESHOT repository secret is missing."; exit 1; }
          printf '%s' "$ADMIN_PASSWORD_HASH_ONESHOT" | npx --yes wrangler@3.90.0 secret put ADMIN_PASSWORD_HASH --config wrangler.toml
