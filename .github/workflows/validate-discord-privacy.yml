name: Validate Discord privacy and dashboard linking
on:
  push:
    branches:
      - main
      - feature/discord-company-overview
    paths:
      - 'src/worker/index.ts'
      - 'src/components/floor/alerts-panel.tsx'
      - '.github/workflows/validate-discord-privacy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-discord-privacy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
