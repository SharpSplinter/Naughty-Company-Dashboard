name: Live browser and authenticated API validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-browser-api-validation.yml"
      - "src/components/floor/floor-app.tsx"
  schedule:
    # Keep production health visible even when no code is being shipped.
    - cron: "23 */6 * * *"

permissions:
  contents: read

jobs:
  live-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check production Worker health
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://naughty-company-api.kboone801.workers.dev/health';
          let response = null;
          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              response = await fetch(url, { headers: { accept: 'application/json' }, signal: AbortSignal.timeout(10000) });
              if (response.ok) break;
            } catch {}
            if (attempt < 3) await new Promise(resolve => setTimeout(resolve, attempt * 2000));
          }
          const body = await response?.json().catch(() => null);
          console.log(`WORKER GET /health -> ${response?.status ?? 'network error'}; database=${body?.database ?? 'unknown'}`);
          if (!response?.ok || body?.ok !== true || body?.database !== 'ok') process.exit(1);
          NODE
      - name: Checkout workflow source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate live Pages sites in Chromium
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const urls = ['https://naughty-company-dashboard.pages.dev/', 'https://a9b464d9.naughty-company-dashboard.pages.dev/'];
          const browser = await chromium.launch({ headless: true });
          let failed = false;
          try {
            for (const url of urls) {
              const page = await browser.newPage();
              const pageErrors = [];
              const consoleErrors = [];
              const failedRequests = [];
              const badResponses = [];
              page.on('pageerror', () => pageErrors.push('uncaught page error'));
              page.on('console', (message) => {
                if (message.type() === 'error') consoleErrors.push(message.text().slice(0, 240));
              });
              page.on('requestfailed', (request) => {
                if (['document', 'script', 'stylesheet', 'xhr', 'fetch'].includes(request.resourceType())) {
                  failedRequests.push(`${request.resourceType()} ${new URL(request.url()).pathname}: ${request.failure()?.errorText ?? 'request failed'}`.slice(0, 240));
                }
              });
              page.on('response', (response) => {
                const request = response.request();
                if (response.status() >= 400 && ['document', 'script', 'stylesheet', 'xhr', 'fetch'].includes(request.resourceType())) {
                  badResponses.push(`${response.status()} ${request.resourceType()} ${new URL(response.url()).pathname}`.slice(0, 240));
                }
              });
              const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 45000 }).catch(() => null);
              const status = response?.status() ?? 0;
              const title = await page.title().catch(() => '');
              const rootExists = await page.locator('#root, [data-reactroot], main').count().catch(() => 0);
              console.log(`BROWSER ${new URL(url).host} -> HTTP ${status}; title=${JSON.stringify(title)}; appRoot=${rootExists > 0}; pageErrors=${pageErrors.length}; consoleErrors=${consoleErrors.length}; failedRequests=${failedRequests.length}; badResponses=${badResponses.length}`);
              for (const detail of [...consoleErrors, ...failedRequests, ...badResponses]) console.error(`BROWSER DETAIL ${new URL(url).host}: ${detail}`);
              if (!response?.ok() || !title || rootExists < 1 || pageErrors.length || consoleErrors.length || failedRequests.length || badResponses.length) failed = true;
              await page.close();
            }

            // Isolate the live frontend from account data and test the owner-only control with a mocked session.
            const adminPage = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await adminPage.addInitScript(() => localStorage.setItem('ncd_session', 'admin-elevation-ui-smoke'));
            await adminPage.route('https://naughty-company-api.kboone801.workers.dev/**', async (route) => {
              const pathname = new URL(route.request().url()).pathname;
              if (pathname === '/api/auth/session') {
                return route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ player: { id: '351311', name: 'Admin UI Smoke Test' }, isAdmin: false, adminElevatedUntil: null, key: { saved: true }, company: { isDirector: false, key: { saved: false }, needsSecondaryKey: true } }) });
              }
              if (pathname === '/api/me/companies') {
                return route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ companies: [] }) });
              }
              return route.fulfill({ status: 404, contentType: 'application/json', body: JSON.stringify({ error: 'Isolated UI smoke test' }) });
            });
            const adminResponse = await adminPage.goto('https://naughty-company-dashboard.pages.dev/', { waitUntil: 'domcontentloaded', timeout: 45000 }).catch(() => null);
            const unlockButton = adminPage.getByRole('button', { name: 'Unlock administration' });
            await unlockButton.waitFor({ state: 'visible', timeout: 15000 }).catch(() => {});
            const unlockVisible = await unlockButton.isVisible().catch(() => false);
            console.log(`ADMIN UI owner-session smoke -> HTTP ${adminResponse?.status() ?? 'network error'}; unlockAdministrationVisible=${unlockVisible}; viewport=390x844`);
            if (!adminResponse?.ok() || !unlockVisible) failed = true;
            await adminPage.close();
          } finally { await browser.close(); }
          if (failed) process.exit(1);
          NODE
      - name: Authenticate with repository Torn API secret and validate live API
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://naughty-company-api.kboone801.workers.dev';
          const apiKey = process.env.TORN_API_KEY;
          if (!apiKey) { console.error('Required repository secret TORN_API_KEY is missing.'); process.exit(1); }
          let token = ''; let failed = false;
          try {
            const loginResponse = await fetch(`${base}/api/auth/sign-in`, { method: 'POST', headers: { 'content-type': 'application/json', accept: 'application/json' }, body: JSON.stringify({ apiKey }) });
            console.log(`API POST /api/auth/sign-in -> ${loginResponse.status}`);
            const login = await loginResponse.json().catch(() => null);
            if (!loginResponse.ok || typeof login?.token !== 'string') { console.error('Authentication failed; response body suppressed.'); failed = true; }
            else {
              token = login.token;
              try {
                const response = await fetch(`${base}/api/auth/session`, { headers: { authorization: `Bearer ${token}`, accept: 'application/json' } });
                const session = await response.json().catch(() => null);
                const ownerIdentity = session?.player?.id === '351311';
                const elevationFlag = session?.canElevateAdmin === true;
                console.log(`API GET /api/auth/session -> ${response.status}; ownerIdentity=${ownerIdentity}; elevationFlag=${elevationFlag}; alreadyElevated=${session?.isAdmin === true}`);
                if (!response.ok || session === null) failed = true;
              } catch { console.error('API GET /api/auth/session -> network error (details suppressed)'); failed = true; }
              for (const path of ['/api/dashboard-members', '/api/me/dashboard-layout', '/api/me/automation-preferences']) {
                try { const response = await fetch(`${base}${path}`, { headers: { authorization: `Bearer ${token}`, accept: 'application/json' } }); const body = await response.json().catch(() => null); console.log(`API GET ${path} -> ${response.status}; json=${body !== null}`); if (!response.ok || body === null) failed = true; }
                catch { console.error(`API GET ${path} -> network error (details suppressed)`); failed = true; }
              }
            }
          } catch { console.error('Authentication request failed; details suppressed.'); failed = true; }
          finally { if (token) { try { const response = await fetch(`${base}/api/auth/sign-out`, { method: 'POST', headers: { authorization: `Bearer ${token}`, accept: 'application/json' } }); console.log(`API POST /api/auth/sign-out -> ${response.status}`); if (!response.ok) failed = true; } catch { console.error('Sign-out request failed; details suppressed.'); failed = true; } } }
          if (failed) process.exit(1);
          NODE
