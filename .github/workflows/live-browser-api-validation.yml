name: Live browser and authenticated API validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate live Pages sites in Chromium
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const urls = ['https://naughty-company-dashboard.pages.dev/', 'https://a9b464d9.naughty-company-dashboard.pages.dev/'];
          const browser = await chromium.launch({ headless: true });
          let failed = false;
          try {
            for (const url of urls) {
              const page = await browser.newPage();
              const pageErrors = [];
              page.on('pageerror', () => pageErrors.push('pageerror'));
              const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 45000 }).catch(() => null);
              const status = response?.status() ?? 0;
              const title = await page.title().catch(() => '');
              const rootExists = await page.locator('#root, [data-reactroot], main').count().catch(() => 0);
              console.log(`BROWSER ${new URL(url).host} -> HTTP ${status}; title=${JSON.stringify(title)}; appRoot=${rootExists > 0}; pageErrors=${pageErrors.length}`);
              if (!response?.ok() || !title || rootExists < 1 || pageErrors.length) failed = true;
              await page.close();
            }
          } finally { await browser.close(); }
          if (failed) process.exit(1);
          NODE
      - name: Authenticate with repository Torn API secret and validate live API
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://naughty-company-api.kboone801.workers.dev';
          const apiKey = process.env.TORN_API_KEY;
          if (!apiKey) { console.error('Required repository secret TORN_API_KEY is missing.'); process.exit(1); }
          let token = ''; let failed = false;
          try {
            const loginResponse = await fetch(`${base}/api/auth/sign-in`, { method: 'POST', headers: { 'content-type': 'application/json', accept: 'application/json' }, body: JSON.stringify({ apiKey }) });
            console.log(`API POST /api/auth/sign-in -> ${loginResponse.status}`);
            const login = await loginResponse.json().catch(() => null);
            if (!loginResponse.ok || typeof login?.token !== 'string') { console.error('Authentication failed; response body suppressed.'); failed = true; }
            else {
              token = login.token;
              for (const path of ['/api/dashboard-members', '/api/me/dashboard-layout', '/api/me/automation-preferences']) {
                try { const response = await fetch(`${base}${path}`, { headers: { authorization: `Bearer ${token}`, accept: 'application/json' } }); const body = await response.json().catch(() => null); console.log(`API GET ${path} -> ${response.status}; json=${body !== null}`); if (!response.ok || body === null) failed = true; }
                catch { console.error(`API GET ${path} -> network error (details suppressed)`); failed = true; }
              }
            }
          } catch { console.error('Authentication request failed; details suppressed.'); failed = true; }
          finally { if (token) { try { const response = await fetch(`${base}/api/auth/sign-out`, { method: 'POST', headers: { authorization: `Bearer ${token}`, accept: 'application/json' } }); console.log(`API POST /api/auth/sign-out -> ${response.status}`); if (!response.ok) failed = true; } catch { console.error('Sign-out request failed; details suppressed.'); failed = true; } } }
          if (failed) process.exit(1);
          NODE