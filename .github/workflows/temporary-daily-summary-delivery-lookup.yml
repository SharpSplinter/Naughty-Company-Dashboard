name: Temporary read-only daily-summary delivery lookup

on:
  push:
    branches:
      - diag/read-daily-summary-2026-10-20

permissions:
  contents: read

jobs:
  read-delivery-row:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query the 2026-10-20 delivery ledger (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) {
            console.error("CLOUDFLARE_API_TOKEN repository secret is unavailable.");
            process.exit(2);
          }
          const response = await fetch(
            "https://api.cloudflare.com/client/v4/accounts/6c03b978ed9a59adc3f61c715bdad45c/d1/database/46f7536d-f69c-4304-8b44-615901c60b7c/query",
            {
              method: "POST",
              headers: {
                authorization: "Bearer " + token,
                "content-type": "application/json",
                accept: "application/json",
              },
              body: JSON.stringify({
                sql: "SELECT substr(discord_user_id, -4) AS accountSuffix, reporting_day AS reportingDay, status, attempts, updated_at AS updatedAt FROM discord_daily_summary_deliveries WHERE reporting_day = ? ORDER BY updated_at ASC LIMIT 50",
                params: ["2026-10-20"],
              }),
            }
          );
          if (!response.ok) {
            console.error("Cloudflare D1 query failed with HTTP " + response.status + ".");
            process.exit(3);
          }
          const payload = await response.json();
          if (payload.success !== true) {
            console.error("Cloudflare D1 returned an unsuccessful read query.");
            process.exit(4);
          }
          const rows = payload.result?.[0]?.results ?? [];
          console.log("Read-only delivery record lookup for reporting_day=2026-10-20");
          console.log(JSON.stringify(rows, null, 2));
          if (rows.length === 0) console.log("NO_DELIVERY_RECORD_FOR_REPORTING_DAY");
          NODE
