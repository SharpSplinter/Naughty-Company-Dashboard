name: Apply faction performance migrations to staging D1

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: Confirm the exact non-production D1 database
        required: true
        type: choice
        options:
          - naughty-company-api-staging

permissions:
  contents: read

concurrency:
  group: naughty-company-api-staging-migrations
  cancel-in-progress: false

jobs:
  migrate-staging:
    if: github.ref == 'refs/heads/portal-rebuild' && inputs.confirm_target == 'naughty-company-api-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed PR branch
        uses: actions/checkout@v4
        with:
          ref: portal-rebuild

      - name: Verify the migration target is pinned to staging
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'name = "naughty-company-api-staging"' wrangler.staging.toml
          grep -F 'database_name = "naughty-company-api-staging"' wrangler.staging.toml
          grep -F 'database_id = "1e37f1a5-daa3-41fb-8c1b-7a9c6e3d0405"' wrangler.staging.toml
          ! grep -F 'bbbe128a-c5cc-46ec-b8ef-93860183e795' wrangler.staging.toml
          ! grep -Eq '^\[\[queues\.(producers|consumers)\]\]|^\[triggers\]' wrangler.staging.toml
          echo "Staging target verified. This workflow does not deploy a Worker or modify production D1."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository quality gates
        run: |
          npm run typecheck
          npm test

      - name: Apply all pending branch migrations to staging D1 only
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: d1 migrations apply naughty-company-api-staging --remote --config wrangler.staging.toml

      - name: Verify migration ledger includes faction performance migration
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: d1 migrations list naughty-company-api-staging --remote --config wrangler.staging.toml

      - name: Verify required staging tables and historical retention schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const accountId = "6c03b978ed9a59adc3f61c715bdad45c";
          const databaseId = "1e37f1a5-daa3-41fb-8c1b-7a9c6e3d0405";
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error("CLOUDFLARE_API_TOKEN is missing.");

          async function query(sql, params = []) {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${databaseId}/query`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "content-type": "application/json",
                },
                body: JSON.stringify({ sql, params }),
                signal: AbortSignal.timeout(20000),
              },
            );
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true || payload?.result?.[0]?.success !== true) {
              throw new Error(`Staging D1 verification query failed with HTTP ${response.status}.`);
            }
            return payload.result[0].results ?? [];
          }

          const migration = await query(
            "SELECT name FROM d1_migrations WHERE name = ?",
            ["0019_faction_performance_collection.sql"],
          );
          if (migration.length !== 1) throw new Error("Migration 0019 is not recorded as applied.");

          const required = [
            "faction_performance_collection_runs",
            "faction_performance_collection_state",
            "faction_membership_intervals",
            "faction_roster_snapshots",
            "faction_member_roster_snapshots",
            "faction_member_stat_snapshots",
            "faction_gym_energy_snapshots",
          ];
          const placeholders = required.map(() => "?").join(", ");
          const rows = await query(
            `SELECT name FROM sqlite_master WHERE type = 'table' AND name IN (${placeholders}) ORDER BY name`,
            required,
          );
          const present = new Set(rows.map((row) => row.name));
          const missing = required.filter((name) => !present.has(name));
          if (missing.length) throw new Error(`Staging schema is missing required tables: ${missing.join(", ")}`);

          const foreignKeys = await query("PRAGMA foreign_key_list(faction_membership_intervals)");
          if (foreignKeys.some((row) => row.table === "players")) {
            throw new Error("Faction membership history must not cascade from player account deletion.");
          }
          console.log("Staging migration ledger, seven collection tables, and departure-safe history schema verified.");
          NODE
