name: One-off Torn FHC-use log collection (encrypted)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/torn-fhc-log-collection.yml"
  workflow_dispatch:
    inputs:
      public_key_b64:
        description: One-time RSA public key in base64; results are encrypted for its holder
        required: true
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch every page of FHC-use logs and encrypt the records
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY_FULL_ACCESS }}
          PUBLIC_KEY_B64: ${{ inputs.public_key_b64 || '' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const apiKey = process.env.TORN_API_KEY;
          if (!apiKey) throw new Error('Required repository secret TORN_API_KEY is missing.');
          const publicKey = Buffer.from(process.env.PUBLIC_KEY_B64 || '', 'base64').toString('utf8');
          if (!publicKey.startsWith('-----BEGIN PUBLIC KEY-----')) throw new Error('Invalid one-time public key.');
          const original = new URL('https://api.torn.com/v2/user/log?to=1793534400&from=1792929600&log=2190');
          const seen = new Set();
          const logs = [];
          let pageCount = 0;
          while (original) {
            const url = new URL(original);
            if (url.origin !== 'https://api.torn.com' || url.pathname !== '/v2/user/log' || url.searchParams.get('log') !== '2190') throw new Error('Unexpected pagination target; stopped.');
            const canonical = url.toString();
            if (seen.has(canonical)) throw new Error('Pagination loop detected.');
            seen.add(canonical);
            pageCount += 1;
            if (pageCount > 1000) throw new Error('Pagination safety limit reached.');
            let response;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              response = await fetch(canonical, { headers: { Authorization: 'ApiKey ' + apiKey, Accept: 'application/json' }, signal: AbortSignal.timeout(30000) }).catch(() => null);
              if (response && response.ok) break;
              const status = response ? response.status : 0;
              if (attempt === 6 || ![429, 500, 502, 503, 504].includes(status)) throw new Error('Torn API failed on page ' + pageCount + ' with HTTP ' + (status || 'network error') + '; response body suppressed.');
              const retry = response.headers.get('retry-after');
              const delay = retry && /^\\d+$/.test(retry) ? Math.min(60000, Number(retry) * 1000) : 3000 * attempt;
              await new Promise(resolve => setTimeout(resolve, delay));
            }
            const payload = await response.json().catch(() => null);
            const pageEntries = Array.isArray(payload?.log) ? payload.log : payload?.log && typeof payload.log === 'object' ? Object.values(payload.log) : null;
            if (!pageEntries) {
              const apiError = payload?.error && typeof payload.error === 'object' ? payload.error : {};
              console.error('TORN_RESPONSE_DIAGNOSTIC ' + JSON.stringify({ http: response.status, topLevelKeys: payload && typeof payload === 'object' ? Object.keys(payload) : [], logType: typeof payload?.log, logIsArray: Array.isArray(payload?.log), errorCode: apiError.code ?? null, errorMessage: apiError.error ?? apiError.message ?? null }));
              throw new Error('Unexpected Torn log response on page ' + pageCount + '; private response content suppressed.');
            }
            logs.push(...pageEntries);
            const next = payload?._metadata?.links?.next;
            if (!next) break;
            const nextUrl = new URL(next, canonical);
            if (nextUrl.origin !== 'https://api.torn.com' || nextUrl.pathname !== '/v2/user/log' || nextUrl.searchParams.get('log') !== '2190') throw new Error('Pagination link changed endpoint or log filter; stopped.');
            await new Promise(resolve => setTimeout(resolve, 700));
            original.href = nextUrl.href;
          }
          const result = { source: 'Torn API v2 user/log', log_type: 2190, description: 'Feathery Hotel Coupon used', window_utc: { from: '2026-10-25T12:00:00.000Z', to: '2026-11-01T12:00:00.000Z' }, pages_scanned: pageCount, matching_records: logs.length, records: logs };
          const plain = Buffer.from(JSON.stringify(result), 'utf8');
          const aesKey = crypto.randomBytes(32);
          const iv = crypto.randomBytes(12);
          const aad = Buffer.from('torn-fhc-log-export:v1');
          const cipher = crypto.createCipheriv('aes-256-gcm', aesKey, iv);
          cipher.setAAD(aad);
          const ciphertext = Buffer.concat([cipher.update(plain), cipher.final()]);
          const wrappedKey = crypto.publicEncrypt({ key: publicKey, padding: crypto.constants.RSA_PKCS1_OAEP_PADDING, oaepHash: 'sha256' }, aesKey);
          const envelope = { v: 1, alg: 'RSA-OAEP-SHA256+A256GCM', aad: aad.toString(), key: wrappedKey.toString('base64'), iv: iv.toString('base64'), tag: cipher.getAuthTag().toString('base64'), data: ciphertext.toString('base64') };
          const encoded = Buffer.from(JSON.stringify(envelope)).toString('base64');
          console.log('FHC_LOG_COLLECTION pages=' + pageCount + ' records=' + logs.length);
          console.log('ENCRYPTED_RESULT_BASE64=' + encoded);
          console.log('No plaintext log records or API credentials were written to the workflow log or artifact.');
          NODE