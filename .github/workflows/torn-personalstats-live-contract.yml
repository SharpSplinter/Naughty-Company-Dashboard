name: Torn personalstats live contract capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-personalstats-shapes:
    name: Capture sanitized Torn personalstats response shapes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture owner personalstats responses without retaining live values
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        run: node scripts/live-personalstats-contract.mjs
      - name: Upload sanitized response-shape fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torn-personalstats-live-sanitized
          path: artifacts/torn-personalstats-live-sanitized.json
          if-no-files-found: warn
          retention-days: 7
