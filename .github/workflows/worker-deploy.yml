name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/worker/**"
      - "src/lib/**"
      - "migrations/auth/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - "scripts/test-backend.mjs"
      - ".github/workflows/worker-deploy.yml"

permissions:
  contents: read

concurrency:
  group: naughty-company-worker-deploy
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Worker and shared code
        run: |
          npm run typecheck
          npm test
      - name: Apply pending D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: d1 migrations apply naughty-company-dashboard --remote --config wrangler.toml
      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c
          command: deploy --config wrangler.toml
