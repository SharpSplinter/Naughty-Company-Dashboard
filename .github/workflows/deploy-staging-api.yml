name: Deploy staging API
on:
  push:
    branches:
      - feature/overview-financials-stock-performance
    paths:
      - 'src/worker/**'
      - 'migrations/auth/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-staging-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Apply migrations to isolated staging D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c03b978ed9a59adc3f61c715bdad45c
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          wrangler d1 migrations apply naughty-company-api-staging --remote --env staging
      - name: Deploy staging API Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c03b978ed9a59adc3f61c715bdad45c
        run: |
          set -euo pipefail
          wrangler deploy --env staging
          curl --fail --silent --show-error https://naughty-company-api-staging.kboone801.workers.dev/health
      - name: Verify saved stock history and daily delta using synthetic staging data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c03b978ed9a59adc3f61c715bdad45c
        run: node scripts/staging-stock-history-smoke.mjs
