name: Verify Cloudflare API token and staging Worker access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-token:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify Cloudflare API token and staging Worker settings access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c03b978ed9a59adc3f61c715bdad45c
          WORKER_NAME: naughty-company-bot-staging
        shell: bash
        run: |
          set +x
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing or empty."
            exit 1
          fi

          accounts_file="$(mktemp)"
          accounts_status="$(curl --silent --show-error --output "$accounts_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/accounts)"

          if [[ "$accounts_status" != "200" ]] || ! jq -e '.success == true and (.result | type == "array")' "$accounts_file" >/dev/null; then
            unset CLOUDFLARE_API_TOKEN
            echo "::error::Cloudflare account-list authentication failed (HTTP $accounts_status). Response body suppressed."
            rm -f "$accounts_file"
            exit 1
          fi
          count="$(jq '.result | length' "$accounts_file")"
          echo "Cloudflare Bearer-token authentication succeeded. Accounts visible to this token: $count."
          rm -f "$accounts_file"

          settings_file="$(mktemp)"
          settings_status="$(curl --silent --show-error --output "$settings_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")"
          unset CLOUDFLARE_API_TOKEN

          if [[ "$settings_status" != "200" ]] || ! jq -e '.success == true' "$settings_file" >/dev/null; then
            echo "::error::Staging Worker settings access failed (HTTP $settings_status). Response body suppressed."
            rm -f "$settings_file"
            exit 1
          fi

          binding_count="$(jq '[.result.bindings // [] | .[]] | length' "$settings_file")"
          binding_names="$(jq -r '[.result.bindings // [] | .[] | select(.name != null) | .name] | unique | join(", ")' "$settings_file")"
          echo "Staging Worker settings access succeeded for $WORKER_NAME."
          echo "Binding count: $binding_count"
          if [[ -n "$binding_names" ]]; then
            echo "Binding names only (values are never printed): $binding_names"
          fi
          rm -f "$settings_file"
