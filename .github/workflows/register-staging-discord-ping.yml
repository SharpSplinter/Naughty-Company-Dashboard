name: Register staging Discord slash command

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: register-staging-discord-command
  cancel-in-progress: false

jobs:
  register-ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Register or verify /ping in the test guild
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_APPLICATION_ID: "1558700958983389254"
          DISCORD_TEST_GUILD_ID: "1525623497999515770"
        run: |
          node --input-type=module <<'NODE'
          const { DISCORD_TOKEN, DISCORD_APPLICATION_ID, DISCORD_TEST_GUILD_ID } = process.env;
          if (!DISCORD_TOKEN) throw new Error("Required repository secret DISCORD_TOKEN is missing.");

          const endpoint = `https://discord.com/api/v10/applications/${DISCORD_APPLICATION_ID}/guilds/${DISCORD_TEST_GUILD_ID}/commands`;
          const headers = {
            Authorization: `Bot ${DISCORD_TOKEN}`,
            "Content-Type": "application/json",
          };

          const listResponse = await fetch(endpoint, { headers });
          if (!listResponse.ok) {
            throw new Error(`Discord command-list request failed with HTTP ${listResponse.status}.`);
          }
          const commands = await listResponse.json();
          let ping = commands.find(command => command.name === "ping" && command.type === 1);

          if (!ping) {
            const createResponse = await fetch(endpoint, {
              method: "POST",
              headers,
              body: JSON.stringify({
                name: "ping",
                description: "Check whether Naughty Company Bot is responding",
                type: 1,
              }),
            });
            if (!createResponse.ok) {
              throw new Error(`Discord command registration failed with HTTP ${createResponse.status}.`);
            }
            ping = await createResponse.json();
            console.log("Registered /ping in the configured test guild.");
          } else {
            console.log("The /ping command is already registered in the configured test guild.");
          }

          if (ping.name !== "ping" || ping.type !== 1) {
            throw new Error("Discord did not confirm the expected /ping command.");
          }
          console.log("Verified /ping registration. Secret values were not printed.");
          NODE
