name: Register staging Discord bot commands

on:
  push:
    branches:
      - feature/staging-discord-link-company
    paths:
      - '.github/workflows/register-staging-discord-ping.yml'
      - 'bot/command-schema.mjs'
      - 'bot/register-commands.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: register-staging-discord-commands
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Register canonical slash commands in the test guild
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_APP_ID: "1558700958983389254"
          DISCORD_GUILD_ID: "1525623497999515770"
        run: node bot/register-commands.mjs
