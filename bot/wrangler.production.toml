name = "naughty-company-bot"
main = "production-worker.js"
compatibility_date = "2026-10-11"

[vars]
# Discord application verification key is public and is required for HTTP interaction signature checks.
DISCORD_PUBLIC_KEY = "631123be1afcaf7bb172fc408f649813590972646370b5a795fc475d5eae7d25"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "BOT_DB"
database_name = "naughty-company-bot-production"
database_id = "46f7536d-f69c-4304-8b44-615901c60b7c"

[[services]]
binding = "DASHBOARD_API"
service = "naughty-company-api"
environment = "production"
